[source]
home = "~/"
downloads = "~/Downloads/"
movies = "~/Movies/"
shows = "~/Shows/"
music = "~/Music/"
files = "~/Files/"
pictures = "~/Pictures/"

[targets]
# Linux example
linux_movies = "username@192.168.1.100:/home/username/Movies/"
linux_shows = "username@192.168.1.100:/home/username/Shows/"
linux_music = "username@192.168.1.100:/home/username/Music/"
linux_files = "username@192.168.1.100:/home/username/Files/"
linux_pictures = "username@192.168.1.100:/home/username/Pictures/"

# macOS example
mac_movies = "username@192.168.1.101:/Users/username/Movies/"
mac_shows = "username@192.168.1.101:/Users/username/Shows/"
mac_music = "username@192.168.1.101:/Users/username/Music/"
mac_files = "username@192.168.1.101:/Users/username/Files/"
mac_pictures = "username@192.168.1.101:/Users/username/Pictures/"

[rsync]
options = [
    "-avh",
    "--partial",
    "--append-verify",
    "--info=progress2",
    "--stats",
    "--exclude=.DS_Store",
    "--exclude=Thumbs.db",
]
